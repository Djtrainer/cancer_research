# Configuration for the CVAE model training on drug-induced gene expression prediction
hidden_dim: 32
num_encoder_layers: 3
encoder_dropout: 0.3

latent_dim: 128

num_decoder_layers: 3
decoder_dropout: 0.3

condition_emb_dim: 128
num_molecular_emb_layers: 10

alpha: 10
beta: 1
beta_anneal: False  # Enable beta annealing
gamma: 3

num_epochs: 20
learning_rate: 0.0001
model_save_dir: "models/drug_induced_gene_expression_prediction"