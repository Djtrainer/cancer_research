# The search method
method: bayes

# The metric to optimize
metric:
  name: total_error_to_minimize
  goal: minimize

# The parameters to search over
parameters:

  learning_rate:
    distribution: uniform
    min: 0.00001
    max: 0.001

  latent_dim:
    values: [16, 32, 64, 128]
  
  hidden_dim:
    values: [32]

  num_encoder_layers:
    values: [0, 1, 2, 3]
  
  encoder_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5

  num_decoder_layers:
    values: [0, 1, 2, 3]

  decoder_dropout:
    distribution: uniform
    min: 0.0
    max: 0.5

  condition_emb_dim:
    values: [128, 256, 512]

  num_molecular_emb_layers:
    values: [0, 1, 2, 5, 10]

  beta_anneal:
    values: [False, True]

  num_epochs:
    values: [20]
    
  gamma:
    distribution: uniform
    min: 0.1
    max: 5

  alpha:
    distribution: uniform
    min: 1
    max: 10000
  
  beta:
    distribution: uniform
    min: 0.01
    max: 1